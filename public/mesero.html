<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-manager · Vista de mesero</title>
<link rel="stylesheet" href="mesero.css">
<style>
  .lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1.25rem; }
  .item { padding:1.1rem 1.25rem; }
  .item__row { display:flex; justify-content:space-between; align-items:center; margin-bottom:.6rem; }
  .item__num { font-size:1.4rem; font-weight:700; color:var(--black); }
  .item__meta { margin-bottom:.9rem; }
  .detail dt { font-size:.82rem; color:var(--gray-500); font-weight:600; margin-top:.8rem; }
  .detail dd { margin:0; }
  .empty { padding:2rem; text-align:center; color:var(--gray-500); grid-column:1/-1; }
  .main--full { max-width:1100px; margin:0 auto; padding:2rem; }
  .tabs { margin-bottom:1.25rem; }
  .seccion { font-size:1rem; margin:1.25rem 0 .6rem; }
  .prod { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.55rem .75rem; border:1px solid var(--gray-200); border-radius:var(--radius); margin-bottom:.4rem; }
  .prod__info { min-width:0; }
  .prod__sub { font-size:.82rem; color:var(--gray-500); }
  .prod-add { display:flex; gap:.5rem; align-items:center; margin-top:.75rem; }
  .prod-add .input, .prod-add .select { flex:1; min-width:0; }
  @media (max-width:560px){ .main--full{ padding:1.25rem; } .prod-add{ flex-wrap:wrap; } }
</style>
</head>
<body>
<nav class="navbar">
  <a class="navbar__brand" href="#"><span>&#9670;</span> R-manager</a>
  <div class="navbar__actions">
    <span id="meseroNombre" class="text-muted"></span>
    <span class="avatar" id="meseroAvatar">M</span>
  </div>
</nav>

<main class="main--full">
  <div class="page-header">
    <div><h1 id="titulo">Mis pedidos</h1><div class="text-muted" id="subtitulo">Pedidos asignados a ti</div></div>
    <div class="flex gap-1">
      <button class="btn btn--outline" onclick="cargarTodo()">Actualizar</button>
      <button class="btn btn--primary" id="btnNuevo" onclick="abrirNuevo()">Nuevo pedido</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab is-active" id="tabPedidos" role="tab" onclick="cambiarVista('pedidos')">Pedidos</button>
    <button class="tab" id="tabMesas" role="tab" onclick="cambiarVista('mesas')">Mesas</button>
  </div>

  <div id="aviso"></div>
  <div class="lista" id="lista"></div>
</main>

<!-- Modal: detalle / edición de pedido -->
<div class="modal-backdrop" id="mPedido">
  <div class="modal modal--lg" role="dialog" aria-modal="true" aria-labelledby="tPedido">
    <div class="modal__header"><h2 class="modal__title" id="tPedido">Pedido</h2><button class="modal__close" onclick="cerrar('mPedido')" aria-label="Cerrar">&times;</button></div>
    <div class="modal__body">
      <dl class="detail" id="detalle"></dl>
      <hr>

      <h3 class="seccion">Datos del pedido</h3>
      <div class="form-row">
        <div class="field">
          <label class="label" for="mesaPedido">Mesa</label>
          <input class="input" id="mesaPedido" type="number" min="1">
        </div>
        <div class="field">
          <label class="label" for="metodo">Método de pago</label>
          <select class="select" id="metodo"></select>
        </div>
      </div>
      <div class="field">
        <label class="label" for="incidente">Incidente</label>
        <textarea class="textarea" id="incidente" placeholder="Describe cualquier incidente con el pedido"></textarea>
        <div class="field__hint" id="hintIncidente"></div>
      </div>
      <div class="field__hint">Mesa, método de pago e incidente se guardan con «Guardar cambios».</div>

      <hr>
      <h3 class="seccion">Productos</h3>
      <div id="productos"></div>
      <div class="prod-add" id="addProd"></div>
      <div class="field__hint">Añadir y quitar productos se aplica al instante.</div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="cerrar('mPedido')">Cerrar</button>
      <button class="btn btn--primary" onclick="guardarPedido()">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Modal: nuevo pedido -->
<div class="modal-backdrop" id="mNuevo">
  <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="tNuevo">
    <div class="modal__header"><h2 class="modal__title" id="tNuevo">Nuevo pedido</h2><button class="modal__close" onclick="cerrar('mNuevo')" aria-label="Cerrar">&times;</button></div>
    <div class="modal__body">
      <div class="field">
        <label class="label" for="nuevaMesa">Mesa</label>
        <input class="input" id="nuevaMesa" type="number" min="1" placeholder="Número de mesa">
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" onclick="cerrar('mNuevo')">Cancelar</button>
      <button class="btn btn--primary" onclick="crearPedido()">Crear pedido</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script>
/* ================= CONFIGURACIÓN ================= */
const TEST_USER = { cedula: '1000034908', clave: 'Chigwi23', idEmpleado: 3 };
const AUTH_HEADER = 'Basic ' + btoa(TEST_USER.cedula + ':' + TEST_USER.clave);
const CONFIG = {
  API: 'http://localhost:8080',
  MESERO_ID: Number(new URLSearchParams(location.search).get('mesero')) || TEST_USER.idEmpleado,
  rutas: {
    mesasEmpleado:     id => `/api/ordenes/mesasEmpleado/${id}`,        // GET  -> [{nombreEmpleado, mesaId, estado}]
    pedidoPorEmpleado: id => `/api/ordenes/pedido/empleado/${id}`,      // GET  -> [Pedido]
    pedido:            id => `/api/ordenes/${id}`,                      // GET  -> Pedido
    crearPedido:       '/api/ordenes/pedido',                           // POST -> PedidoInsertDTO
    mesa:              '/api/ordenes/pedido/mesa',                      // PUT  -> PedidoUpdateMesaDTO
    incidente:         '/api/ordenes/pedido/incidente',                 // PUT  -> PedidoUpdateIncidenteDTO
    getIncidente:      id => `/api/ordenes/pedido/incidente/${id}`,     // GET  -> texto del incidente (String)
    metodoPago:        '/api/ordenes/pedido/metodoDePago',              // PUT  -> PedidoUpdateMetodoDePagoDTO
    agregarProductos:  id => `/api/ordenes/pedido/productos/add/${id}`,    // PUT -> [Detalle_producto]  (devuelve Pedido)
    quitarProductos:   id => `/api/ordenes/pedido/productos/remove/${id}`, // PUT -> [Long]              (devuelve Pedido)
    catalogo:          '/api/menu/productos'                            // GET  -> [{id, nombre}]  (AJUSTAR a tu ruta real del menú)
  },
  // ids según PedidoService.updateMetodoDePago: 1 Efectivo, 2 Tarjeta, 3 BREB
  metodos: [{ id: 1, nombre: 'Efectivo' }, { id: 2, nombre: 'Tarjeta' }, { id: 3, nombre: 'Bre-B' }]
};

/* Cuerpos de cada petición. Si el backend usa otros nombres de campo, se cambian SOLO aquí. */
const DTO = {
  crearPedido: (idMesa, idMesero)   => ({ id_mesa: idMesa, id_mesero: idMesero }),
  mesa:        (idPedido, idMesa) => ({ id: idPedido, idmesa: idMesa }),  // PedidoUpdateMesaDTO (supuesto)
  incidente:   (id, incidente)      => ({ id, incidente }),               // según la guía
  metodoPago:  (idPedido, idMetodo) => ({ idPedido, idMetodo }),          // según la guía
  // Detalle_producto { id_detalle_producto, producto, notas, pedido }: el producto va anidado; no hay campo cantidad
  detalle:     (idProducto, notas)  => ({ producto: { id_producto: idProducto }, notas: notas || null })
};

/* ================= DATOS DEMO ================= */
const DEMO = {
  mesas: [{ nombreEmpleado: 'Jane', mesaId: 2, estado: 'Pendiente' }],
  pedidos: [{
    id_pedido: 1, mesa: { id: 2, cupo: 2, ocupada: false },
    mesero: { id_empleado: 5, nombre: 'Jane', apellido: 'Doe', correo: 'JaneDoe@outlook.com', rol: { id_rol: 2, nombre: 'mesero' } },
    estado: { id_estado: 1, nombre: 'Pendiente' },
    fecha_creacion: '2026-10-19T22:01:03.077829', fecha_ultima_actualizacion: '2026-10-19T22:13:56.165548',
    precio_total: null, metodo_de_pago: 'Tarjeta'
  }]
};
let demo = false, actual = null, vista = 'pedidos', pedidos = [], mesas = [], catalogo = null;

/* ================= UTILIDADES ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const abrir = id => $(id).classList.add('is-open');
const cerrar = id => $(id).classList.remove('is-open');
document.querySelectorAll('.modal-backdrop').forEach(b => b.addEventListener('click', e => { if (e.target === b) cerrar(b.id); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop.is-open').forEach(m => m.classList.remove('is-open')); });

function toast(msg, tipo) {
  const t = document.createElement('div');
  t.className = 'toast' + (tipo ? ' toast--' + tipo : '');
  t.textContent = msg; $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
async function api(ruta, metodo = 'GET', cuerpo) {
  const headers = { 'Authorization': AUTH_HEADER };
  if (cuerpo !== undefined) headers['Content-Type'] = 'application/json';
  const r = await fetch(CONFIG.API + ruta, {
    method: metodo, headers, body: cuerpo !== undefined ? JSON.stringify(cuerpo) : undefined
  });
  if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; }
  const txt = await r.text();
  try { return txt ? JSON.parse(txt) : null; } catch { return txt; }  // algunos endpoints devuelven texto plano
}
const claseEstado = e => ({ pendiente:'badge--warning', preparando:'badge--gold', 'en cocina':'badge--warning', servido:'badge--success', cancelado:'badge--danger' }[String(e).toLowerCase()] || '');
const fecha = f => f ? new Date(f).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const dinero = n => n == null ? 'Sin calcular' : '$' + Number(n).toLocaleString('es-CO');

/* Incidente: el backend solo admite UNO por pedido y no permite editarlo.
   Se lee del JSON del pedido; conIncidente recuerda los pedidos que ya lo tienen
   (registrado aquí o detectado por el error de clave duplicada). */
const conIncidente = new Set();
let incidenteActual = null;   // { existe, texto } | { error: true } | null (sin consultar)

// GET /pedido/incidente/{id} devuelve el texto del incidente; vacío, "null" o 404/204 = no hay
async function traerIncidente(id) {
  const r = await fetch(CONFIG.API + CONFIG.rutas.getIncidente(id), { headers: { 'Authorization': AUTH_HEADER } });
  if (r.status === 404 || r.status === 204) return { existe: false, texto: '' };
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const t = (await r.text()).trim();
  const vacio = !t || t === 'null';
  return { existe: !vacio, texto: vacio ? '' : t };
}
async function refrescarIncidente(id) {
  if (demo) { incidenteActual = null; return; }
  try { incidenteActual = await traerIncidente(id); }
  catch (e) { console.warn('No se pudo consultar el incidente', e); incidenteActual = { error: true }; }
}
const incidenteDe = p => { const r = p?.incidente ?? p?.incidentes ?? null; return Array.isArray(r) ? (r[0] ?? null) : r; };
const tieneIncidente = p => { const i = incidenteDe(p); return (i != null && i !== '') || conIncidente.has(p?.id_pedido); };
const textoIncidente = i => {
  if (i == null) return '';
  if (typeof i !== 'object') return String(i);
  const conocido = i.descripcion ?? i.incidente ?? i.detalle ?? i.texto ?? i.mensaje;
  if (conocido != null) return String(conocido);
  const primero = Object.entries(i).find(([k, v]) => typeof v === 'string' && !/fecha|date|id/i.test(k));
  return primero ? primero[1] : '';
};

// Productos del pedido: el nombre del campo depende de la entidad Pedido
const productosDe = p => { const l = p?.productos ?? p?.detalle_productos ?? p?.detalleProductos ?? p?.detalles ?? []; return Array.isArray(l) ? l : []; };
// Sirve para un Detalle_producto ({ producto: {...} }) y para un Producto del catálogo
const idProd     = x => x?.producto?.id_producto ?? x?.id_producto ?? x?.id;
const idDetalle  = x => x?.id_detalle_producto;   // PedidoService.removeProductosFromPedido recibe ids de detalle
const nomProd    = x => x?.producto?.nombre ?? x?.nombre ?? ('Producto ' + idProd(x));
const precioProd = x => x?.producto?.precio ?? x?.precio;
const norm       = t => String(t ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');   // compara nombres sin depender de mayúsculas/guiones

/* ================= CARGA ================= */
async function cargarTodo() {
  const [rp, rm] = await Promise.allSettled([
    api(CONFIG.rutas.pedidoPorEmpleado(CONFIG.MESERO_ID)),
    api(CONFIG.rutas.mesasEmpleado(CONFIG.MESERO_ID))
  ]);
  if (rp.status === 'rejected' && rm.status === 'rejected') {
    console.error(rp.reason, rm.reason);
    demo = true; pedidos = DEMO.pedidos; mesas = DEMO.mesas;
    $('aviso').innerHTML = '<div class="alert alert--info">No se pudo conectar con la API. Mostrando datos de ejemplo.</div>';
  } else {
    demo = false; $('aviso').innerHTML = '';
    if (rp.status === 'rejected') { console.error(rp.reason); toast('No se pudieron cargar los pedidos', 'danger'); }
    if (rm.status === 'rejected') { console.error(rm.reason); toast('No se pudieron cargar las mesas', 'danger'); }
    const aLista = v => v == null ? [] : Array.isArray(v) ? v : [v];
    pedidos = aLista(rp.value); mesas = aLista(rm.value);
  }
  const nombre = pedidos[0]?.mesero?.nombre ?? mesas[0]?.nombreEmpleado;
  if (nombre) { $('meseroNombre').textContent = nombre; $('meseroAvatar').textContent = nombre[0].toUpperCase(); }
  pintar();
}

function cambiarVista(v) {
  vista = v;
  $('tabPedidos').classList.toggle('is-active', v === 'pedidos');
  $('tabMesas').classList.toggle('is-active', v === 'mesas');
  pintar();
}

/* ================= PINTAR LISTAS ================= */
function pintar() {
  const esPedidos = vista === 'pedidos';
  $('titulo').textContent = esPedidos ? 'Mis pedidos' : 'Mis mesas';
  $('subtitulo').textContent = esPedidos ? 'Pedidos asignados a ti' : 'Mesas asociadas a ti (solo consulta)';
  $('btnNuevo').hidden = !esPedidos;

  if (esPedidos) {
    $('lista').innerHTML = pedidos.length ? pedidos.map(p => `
      <div class="card item stat">
        <div class="item__row"><span class="item__num">Pedido #${esc(p.id_pedido)}</span>
          <span class="badge ${claseEstado(p.estado?.nombre)}">${esc(p.estado?.nombre)}</span></div>
        <div class="item__meta text-muted">Mesa ${esc(p.mesa?.id)} · ${esc(dinero(p.precio_total))}<br>Pago: ${esc(p.metodo_de_pago ?? '—')}</div>
        <button class="btn btn--outline btn--sm btn--block" onclick="verPedido(${Number(p.id_pedido)})">Ver y editar</button>
      </div>`).join('')
      : '<div class="card empty">No tienes pedidos. Crea uno con «Nuevo pedido».</div>';
  } else {
    $('lista').innerHTML = mesas.length ? mesas.map(m => `
      <div class="card item stat">
        <div class="item__row"><span class="item__num">Mesa ${esc(m.mesaId)}</span>
          <span class="badge ${claseEstado(m.estado)}">${esc(m.estado)}</span></div>
        <div class="text-muted">Mesero: ${esc(m.nombreEmpleado)}</div>
      </div>`).join('')
      : '<div class="card empty">No tienes mesas asociadas.</div>';
  }
}

/* ================= POP UP DEL PEDIDO ================= */
async function verPedido(id) {
  try { actual = demo ? pedidos.find(p => p.id_pedido === id) : await api(CONFIG.rutas.pedido(id)); }
  catch (e) { console.error(e); return toast('No se pudo cargar el pedido ' + id, 'danger'); }
  if (!actual) return toast('No se encontró el pedido ' + id, 'danger');
  await cargarCatalogo();
  await refrescarIncidente(id);
  pintarPedido();
  abrir('mPedido');
}

function pintarDetalle() {
  $('tPedido').textContent = 'Pedido #' + actual.id_pedido;
  $('detalle').innerHTML = `
    <dt>Estado</dt><dd><span class="badge ${claseEstado(actual.estado?.nombre)}">${esc(actual.estado?.nombre)}</span></dd>
    <dt>Mesero</dt><dd>${esc(actual.mesero?.nombre)} ${esc(actual.mesero?.apellido)}</dd>
    <dt>Creado</dt><dd>${fecha(actual.fecha_creacion)}</dd>
    <dt>Última actualización</dt><dd>${fecha(actual.fecha_ultima_actualizacion)}</dd>
    <dt>Total</dt><dd>${esc(dinero(actual.precio_total))}</dd>`;
}

function pintarProductos() {
  const lista = productosDe(actual);
  $('productos').innerHTML = lista.length ? lista.map(x => {
    const id = idDetalle(x);
    const cant = [precioProd(x) != null ? esc(dinero(precioProd(x))) : '', x.notas ? `Notas: ${esc(x.notas)}` : ''].filter(Boolean).join(' · ');
    return `<div class="prod">
      <div class="prod__info"><div>${esc(nomProd(x))}</div><div class="prod__sub">${cant}</div></div>
      <button class="btn btn--outline btn--sm" ${id == null ? 'disabled' : `onclick="quitarProducto(${Number(id)})"`}>Quitar</button>
    </div>`;
  }).join('') : '<div class="text-muted">Este pedido aún no tiene productos.</div>';
}

function pintarPedido() {
  pintarDetalle();
  $('mesaPedido').value = actual.mesa?.id ?? '';
  $('metodo').innerHTML = CONFIG.metodos.map(m =>
    `<option value="${m.id}" ${norm(m.nombre) === norm(actual.metodo_de_pago) ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('');
  // El incidente se consulta al endpoint; si no se pudo, se usa el JSON del pedido como respaldo
  const bloqueado = !!incidenteActual?.existe || tieneIncidente(actual);
  $('incidente').value = incidenteActual?.texto || textoIncidente(incidenteDe(actual));
  $('incidente').disabled = bloqueado;
  $('incidente').placeholder = bloqueado ? 'Este pedido ya tiene un incidente registrado' : 'Describe el incidente';
  $('hintIncidente').textContent = bloqueado
    ? 'Este pedido ya tiene un incidente: no se puede editar ni añadir otro.'
    : incidenteActual?.error
      ? 'No se pudo consultar el incidente. Solo se admite uno por pedido; si ya existe, el servidor rechazará añadir otro.'
      : 'Solo se puede registrar un incidente por pedido; después no podrá editarse.';
  pintarProductos();
  // selector de producto: del catálogo si cargó, si no, por id
  const selector = catalogo && catalogo.length
    ? `<select class="select" id="prodSel">${catalogo.map(c => `<option value="${esc(idProd(c))}">${esc(nomProd(c))}${precioProd(c) != null ? ' · ' + esc(dinero(precioProd(c))) : ''}</option>`).join('')}</select>`
    : `<input class="input" id="prodSel" type="number" min="1" placeholder="ID del producto">`;
  $('addProd').innerHTML = `${selector}
    <input class="input" id="prodNotas" type="text" maxlength="200" placeholder="Notas (opcional)" aria-label="Notas">
    <button class="btn btn--dark btn--sm" onclick="agregarProducto()">Añadir</button>`;
}

async function cargarCatalogo() {
  if (catalogo !== null || demo) return;
  try { const l = await api(CONFIG.rutas.catalogo); catalogo = Array.isArray(l) ? l : []; }
  catch (e) { console.error('Catálogo no disponible:', e); catalogo = []; }
}

/* Una función por endpoint del backend */
const actualizarMesa       = (id, idMesa)   => api(CONFIG.rutas.mesa,       'PUT', DTO.mesa(id, idMesa));
const actualizarIncidente  = (id, texto)    => api(CONFIG.rutas.incidente,  'PUT', DTO.incidente(id, texto));
const actualizarMetodoPago = (id, idMetodo) => api(CONFIG.rutas.metodoPago, 'PUT', DTO.metodoPago(id, idMetodo));

// Productos: el backend devuelve el Pedido actualizado
async function aplicarProductos(promesa, okMsg) {
  if (demo) return toast('Modo demo: no se envió nada');
  try {
    const p = await promesa;
    if (p && typeof p === 'object') actual = p; else actual = await api(CONFIG.rutas.pedido(actual.id_pedido));
    pintarDetalle(); pintarProductos(); toast(okMsg, 'success'); cargarTodo();
  } catch (e) { console.error(e); toast('No se pudo actualizar los productos', 'danger'); }
}
function agregarProducto() {
  const idProducto = Number($('prodSel').value), notas = $('prodNotas').value.trim();
  if (!idProducto) return toast('Elige un producto', 'danger');
  aplicarProductos(
    demo ? null : api(CONFIG.rutas.agregarProductos(actual.id_pedido), 'PUT', [DTO.detalle(idProducto, notas)]),
    'Producto añadido');
}
function quitarProducto(idProducto) {
  aplicarProductos(
    demo ? null : api(CONFIG.rutas.quitarProductos(actual.id_pedido), 'PUT', [idProducto]),
    'Producto quitado');
}

// Mesa, método de pago e incidente: solo se envía lo que cambió, cada uno a su endpoint y en orden
async function guardarPedido() {
  const id = actual.id_pedido;
  const tareas = [];

  const mesaNueva = Number($('mesaPedido').value);
  if (mesaNueva && mesaNueva !== actual.mesa?.id) tareas.push(['mesa', () => actualizarMesa(id, mesaNueva)]);

  const metodoSel = CONFIG.metodos.find(m => m.id === Number($('metodo').value));
  if (metodoSel && norm(metodoSel.nombre) !== norm(actual.metodo_de_pago)) tareas.push(['método de pago', () => actualizarMetodoPago(id, metodoSel.id)]);

  // Solo se permite añadir un incidente si el pedido no tiene ninguno
  const texto = $('incidente').value.trim();
  if (!$('incidente').disabled && texto) {
    if (!confirm('Solo se puede registrar un incidente por pedido y después no podrá editarse. ¿Registrarlo?')) return;
    tareas.push(['incidente', async () => { await actualizarIncidente(id, texto); conIncidente.add(id); }]);
  }

  if (!tareas.length) return toast('No hay cambios que guardar');
  if (demo) { cerrar('mPedido'); return toast('Modo demo: no se envió nada'); }

  const fallos = [];
  for (const [nombre, enviar] of tareas) {
    try { await enviar(); }
    catch (e) {
      console.error(nombre, e);
      // 500 al añadir incidente = clave duplicada: el pedido ya tenía uno
      if (nombre === 'incidente' && e.status === 500) { conIncidente.add(id); fallos.push('incidente (el pedido ya tiene uno)'); }
      else fallos.push(nombre === 'mesa' && e.status === 500 ? 'mesa (¿la nueva mesa ya está ocupada?)' : nombre);
    }
  }

  try { actual = await api(CONFIG.rutas.pedido(id)); } catch (e) { console.error(e); }  // estado real tras guardar
  if (fallos.length) { await refrescarIncidente(id); pintarPedido(); toast('No se pudo guardar: ' + fallos.join(', '), 'danger'); }
  else { cerrar('mPedido'); toast('Pedido actualizado', 'success'); }
  cargarTodo();
}

/* ================= NUEVO PEDIDO ================= */
function abrirNuevo() { $('nuevaMesa').value = ''; abrir('mNuevo'); }
async function crearPedido() {
  const mesaId = Number($('nuevaMesa').value);
  if (!mesaId) return toast('Indica el número de mesa', 'danger');
  try {
    if (!demo) await api(CONFIG.rutas.crearPedido, 'POST', DTO.crearPedido(mesaId, CONFIG.MESERO_ID));
    cerrar('mNuevo'); toast('Pedido creado', 'success'); cargarTodo();
  } catch (e) { console.error(e); toast(e.status === 500 ? 'No se pudo crear el pedido (¿la mesa ya está ocupada?)' : 'No se pudo crear el pedido', 'danger'); }
}

cargarTodo();
</script>
