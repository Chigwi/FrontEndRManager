<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú · R-manager</title>
<link rel="stylesheet" href="theme.css">
<script src="auth.js"></script>
<script>Auth.require(); // sin sesión, vuelve a login.html</script>
<style>
/* Extensiones del tema (pegar en theme.css si se quiere centralizar) */
.menu-wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
.menu-filters { padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
.menu-filters__row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 1rem; align-items: end; }
.menu-filters .field { margin: 0; }
.menu-filters .tabs { margin: 1rem 0 0; overflow-x: auto; white-space: nowrap; }
.menu-filters .tab { flex: none; }
.menu-count { margin: 0 0 .75rem; }
.menu-grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.menu-item {
  display: flex; align-items: baseline; justify-content: space-between; gap: 1rem;
  width: 100%; padding: 1rem 1.25rem; text-align: left; font: inherit; cursor: pointer;
  background: var(--white); color: var(--gray-900);
  border: 1px solid var(--gray-200); border-left: 3px solid var(--gold); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); transition: border-color .15s, background .15s, box-shadow .15s;
}
.menu-item:hover { background: var(--gold-tint); box-shadow: var(--shadow-md); }
.menu-item__name { font-weight: 600; color: var(--black); }
.menu-item__price { font-weight: 700; color: var(--gold-dark); white-space: nowrap; }
.detail__price { font-size: 2rem; font-weight: 700; color: var(--black); margin: 0 0 .75rem; }
.detail__badges { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
.empty { padding: 2.5rem 1rem; text-align: center; }
.skeleton { background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; border-radius: 4px; }
.skeleton--tab { flex: none; width: 110px; height: 18px; margin: .8rem .9rem; }
.skeleton--text { display: inline-block; width: 90px; height: 14px; }
.menu-item--skeleton { cursor: default; border-left-color: var(--gray-300); box-shadow: var(--shadow-sm); }
.menu-item--skeleton:hover { background: var(--white); box-shadow: var(--shadow-sm); }
.menu-item--skeleton .skeleton { height: 16px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Menú de usuario y cierre de sesión ---------- */
.user-btn {
  display: flex; align-items: center; gap: .65rem;
  padding: .25rem .6rem .25rem .25rem; font: inherit; color: var(--white);
  background: transparent; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.user-btn:hover, .dropdown.is-open .user-btn { background: rgba(255,255,255,.08); border-color: var(--gold); }
.user-btn__text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; text-align: left; }
.user-btn__name { font-weight: 600; font-size: .9rem; }
.user-btn__rol { font-size: .75rem; color: var(--gold-light); text-transform: capitalize; }
.user-btn__chev { width: 8px; height: 8px; border-right: 2px solid var(--gray-300); border-bottom: 2px solid var(--gray-300); transform: rotate(45deg) translateY(-2px); transition: transform .15s; }
.dropdown.is-open .user-btn__chev { transform: rotate(-135deg) translateY(-2px); }
.user-menu { min-width: 270px; padding: 0; overflow: hidden; }
.user-card { display: flex; align-items: center; gap: .8rem; padding: 1rem; background: var(--gray-50); border-bottom: 1px solid var(--gray-200); }
.user-card .avatar { width: 44px; height: 44px; font-size: 1rem; flex: none; }
.user-card__name { font-weight: 600; color: var(--black); line-height: 1.2; }
.user-card__mail { font-size: .82rem; color: var(--gray-500); overflow-wrap: anywhere; }
.user-card .badge { margin-top: .35rem; text-transform: capitalize; }
.user-menu__list { padding: .35rem; }
.dropdown__item--icon { display: flex; align-items: center; gap: .65rem; font-weight: 500; }
.dropdown__item--danger:hover { background: var(--danger-bg); }
.dropdown__item svg { width: 18px; height: 18px; flex: none; }
.modal__icon { width: 48px; height: 48px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--danger-bg); color: var(--danger); }
.modal__icon svg { width: 24px; height: 24px; }

/* ---------- Pedido: cantidad, lista y botón del navbar ---------- */
.qty { display: inline-flex; align-items: center; border: 1px solid var(--gray-300); border-radius: var(--radius); background: var(--white); }
.qty button { width: 34px; height: 34px; border: 0; background: none; font: inherit; font-size: 1.1rem; line-height: 1; color: var(--gray-700); cursor: pointer; border-radius: var(--radius); }
.qty button:hover:not(:disabled) { background: var(--gray-100); color: var(--black); }
.qty button:disabled { opacity: .4; cursor: not-allowed; }
.qty output { min-width: 34px; text-align: center; font-weight: 600; }
.detail__qty { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-top: 1rem; margin-top: 1rem; border-top: 1px solid var(--gray-200); }
.btn-pedido .badge { margin-left: .15rem; }
.pedido-list { list-style: none; margin: 0 0 .5rem; padding: 0; }
.pedido-row { display: grid; grid-template-columns: 1fr auto; gap: .35rem 1rem; align-items: center; padding: .8rem 0; border-bottom: 1px solid var(--gray-200); }
.pedido-row__name { font-weight: 600; color: var(--black); }
.pedido-row__sub { font-size: .85rem; color: var(--gray-500); }
.pedido-row__side { display: flex; align-items: center; gap: .75rem; }
.pedido-row__total { font-weight: 700; min-width: 64px; text-align: right; }
.pedido-remove { background: none; border: 0; padding: .2rem .4rem; font: inherit; font-size: .85rem; color: var(--danger); cursor: pointer; border-radius: var(--radius); }
.pedido-remove:hover { background: var(--danger-bg); }
.pedido-total { display: flex; justify-content: space-between; margin: 1rem 0 0; font-size: 1.15rem; font-weight: 700; color: var(--black); }

@media (max-width: 700px) {
  .menu-filters__row { grid-template-columns: 1fr; }
  .menu-wrap { padding: 1.25rem 1rem 2rem; }
  .user-btn__text { display: none; }
  .user-btn { padding-right: .5rem; }
  .pedido-row { grid-template-columns: 1fr; }
  .pedido-row__side { justify-content: space-between; }
}
</style>
</head>
<body>
<nav class="navbar">
  <a class="navbar__brand" href="menu.html"><span>&#9670;</span> R-manager</a>
  <ul class="navbar__links"><li><a class="is-active" href="menu.html">Menú</a></li></ul>

  <div class="navbar__actions">
    <button class="btn btn--primary btn--sm btn-pedido" id="btnPedido" type="button" aria-label="Ver pedido actual">
      Pedido <span class="badge badge--dark" id="pedidoCount">0</span>
    </button>
    <div class="dropdown" id="userDropdown">
      <button class="user-btn" id="btnUsuario" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menú de usuario">
        <span class="avatar" id="uAvatar">?</span>
        <span class="user-btn__text">
          <span class="user-btn__name" id="uNombre">Usuario</span>
          <span class="user-btn__rol" id="uRol"></span>
        </span>
        <span class="user-btn__chev" aria-hidden="true"></span>
      </button>
      <div class="dropdown__menu user-menu" role="menu">
        <div class="user-card">
          <span class="avatar" id="uAvatar2">?</span>
          <div>
            <div class="user-card__name" id="uNombre2">Usuario</div>
            <div class="user-card__mail" id="uCorreo"></div>
            <span class="badge badge--dark" id="uRol2"></span>
          </div>
        </div>
        <div class="user-menu__list">
          <button class="dropdown__item dropdown__item--icon dropdown__item--danger" id="btnSalir" type="button" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<main class="menu-wrap">
  <div class="page-header">
    <div><h1>Menú</h1><div class="text-muted">Toca un producto para ver el detalle</div></div>
    <a class="btn btn--outline" id="btnVolver" href="mesero.html">&larr; Volver a mesero</a>
  </div>

  <div id="alerta"></div>

  <section class="card menu-filters" aria-label="Filtros del menú">
    <div class="menu-filters__row">
      <div class="field">
        <label class="label" for="buscar">Buscar</label>
        <input class="input" id="buscar" type="search" placeholder="Nombre del producto">
      </div>
      <div class="field">
        <label class="label" for="orden">Ordenar por</label>
        <select class="select" id="orden">
          <option value="nombre">Nombre (A–Z)</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
        </select>
      </div>
      <button class="btn btn--outline" id="btnDia" type="button" aria-pressed="false">Menú del día</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Categorías"></div>
  </section>

  <p class="text-muted menu-count" id="conteo" aria-live="polite"></p>
  <div class="menu-grid" id="lista"></div>
</main>

<!-- Detalle de producto -->
<div class="modal-backdrop" id="detalle">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dNombre">
    <div class="modal__header">
      <h2 class="modal__title" id="dNombre"></h2>
      <button class="modal__close" id="dCerrar" aria-label="Cerrar">&times;</button>
    </div>
    <div class="modal__body">
      <p class="detail__price" id="dPrecio"></p>
      <div class="detail__badges" id="dBadges"></div>
      <div id="dDesc" class="mb-2"></div>
      <div class="text-muted" id="dCat"></div>
      <div class="detail__qty">
        <span class="label" style="margin:0" id="dQtyLabel">Cantidad</span>
        <div class="qty" role="group" aria-labelledby="dQtyLabel">
          <button type="button" id="dMenos" aria-label="Quitar una unidad">&minus;</button>
          <output id="dCant" aria-live="polite">1</output>
          <button type="button" id="dMas" aria-label="Agregar una unidad">+</button>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" id="dOk" type="button">Cerrar</button>
      <button class="btn btn--primary" id="dAgregar" type="button" disabled>Agregar al pedido</button>
    </div>
  </div>
</div>

<!-- Pedido actual -->
<div class="modal-backdrop" id="pedido">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pTitulo">
    <div class="modal__header">
      <h2 class="modal__title" id="pTitulo">Pedido actual</h2>
      <button class="modal__close" id="pCerrar" aria-label="Cerrar">&times;</button>
    </div>
    <div class="modal__body">
      <div class="field">
        <label class="label" for="pId">N.º de pedido</label>
        <input class="input" id="pId" type="number" min="1" step="1" inputmode="numeric" placeholder="Ej. 12">
        <div class="field__hint">Los productos se agregarán a este pedido.</div>
      </div>
      <div id="pError"></div>
      <div id="pContenido"></div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" id="pVaciar" type="button">Vaciar</button>
      <button class="btn btn--primary" id="pEnviar" type="button">Agregar al pedido</button>
    </div>
  </div>
</div>

<!-- Confirmación de cierre de sesión -->
<div class="modal-backdrop" id="salir">
  <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="sTitulo">
    <div class="modal__body">
      <div class="modal__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <h2 class="modal__title" id="sTitulo">¿Cerrar sesión?</h2>
      <p class="text-muted" style="margin:.5rem 0 0">Tendrás que ingresar de nuevo con tu cédula y contraseña.</p>
    </div>
    <div class="modal__footer">
      <button class="btn btn--outline" id="sCancelar" type="button">Seguir aquí</button>
      <button class="btn btn--danger" id="sConfirmar" type="button">Cerrar sesión</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toasts" aria-live="polite"></div>

<script>
// URLs del backend (completar con las reales).
const API_URL = 'http://localhost:8080/api/menu';                    // todos los productos; el detalle es API_URL + '/' + id
const API_MENU_DIA = 'http://localhost:8080/api/menu/menu_del_dia';  // solo el menú del día
const API_PEDIDO_ADD = 'http://localhost:8080/api/ordenes/pedido/productos/add'; // PUT + '/' + idPedido (ajusta el prefijo si tu controlador es distinto)
const AUTH = { headers: { 'Authorization': 'Basic ' + btoa('1000034908:Chigwi23') } };
const $ = id => document.getElementById(id);
const moneda = n => new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'}).format(n);
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();


// ---- Sesión: datos del usuario y cierre de sesión ----
function pintarUsuario() {
  const u = Auth.user() || {};
  const nombre = [u.nombre, u.apellido].filter(Boolean).join(' ') || 'Usuario';
  const iniciales = (((u.nombre || '')[0] || '') + ((u.apellido || '')[0] || '')).toUpperCase() || '?';
  const rol = u.rol || '';
  $('uAvatar').textContent = iniciales;   $('uAvatar2').textContent = iniciales;
  $('uNombre').textContent = nombre;      $('uNombre2').textContent = nombre;
  $('uRol').textContent = rol;            $('uRol2').textContent = rol;
  $('uRol2').hidden = !rol;
  $('uCorreo').textContent = u.correo || '';
}

function menuUsuario(abrir) {
  const d = $('userDropdown');
  const abierto = abrir === undefined ? !d.classList.contains('is-open') : abrir;
  d.classList.toggle('is-open', abierto);
  $('btnUsuario').setAttribute('aria-expanded', abierto);
}

function pedirSalir() {
  menuUsuario(false);
  $('salir').classList.add('is-open');
  $('sCancelar').focus();
}
function cancelarSalir() {
  $('salir').classList.remove('is-open');
  $('btnUsuario').focus();
}

$('btnUsuario').addEventListener('click', e => { e.stopPropagation(); menuUsuario(); });
document.addEventListener('click', e => { if (!$('userDropdown').contains(e.target)) menuUsuario(false); });
$('btnSalir').addEventListener('click', pedirSalir);
$('sCancelar').addEventListener('click', cancelarSalir);
$('sConfirmar').addEventListener('click', () => Auth.logout());
$('salir').addEventListener('click', e => { if (e.target === $('salir')) cancelarSalir(); });


// ---- Agrupación de categorías para mostrar ----
const GRUPOS = [
  ['comidas', 'Comidas'],
  ['hamburguesas', 'Hamburguesas'],
  ['pizzas', 'Pizzas'],
  ['frias', 'Bebidas frías'],
  ['calientes', 'Bebidas calientes'],
  ['postres', 'Postres']
];
const NOMBRE_GRUPO = Object.fromEntries(GRUPOS);

// Palabras clave del nombre del producto (se revisan primero, en este orden)
const PALABRAS = [
  ['hamburguesas', ['hamburguesa', 'burger', 'cheeseburger']],
  ['pizzas',    ['pizza', 'calzone']],
  ['postres',   ['pie', 'pastel', 'torta', 'tarta', 'cheesecake', 'brownie', 'flan', 'helado', 'mousse', 'gelatina', 'tiramisu', 'tres leches', 'postre', 'galleta', 'cupcake', 'waffle', 'crepe', 'natilla', 'arroz con leche', 'brigadeiro', 'tarta']],
  ['calientes', ['cafe', 'espresso', 'capuchino', 'cappuccino', 'latte', 'mocca', 'moca', 'americano', 'macchiato', 'chocolate caliente', 'te caliente', 'infusion', 'aromatica', 'aromarica', 'frutos rojos', 'chai', 'canelazo']],
  ['frias',     ['jugo', 'limonada', 'gaseosa', 'soda', 'cerveza', 'batido', 'malteada', 'frappe', 'smoothie', 'agua', 'te frio', 'te helado', 'granizado', 'cola', 'coca', 'sprite', 'michelada', 'cocktail', 'coctel', 'mojito', 'vino', 'naranjada', 'refresco', 'cereza', 'fresa', 'mora', 'mango', 'maracuya', 'lulo', 'naranja', 'malta', 'chicha', 'tropical']]
];

// Reglas por nombre de categoría del backend (se usan si ninguna palabra clave coincide)
const CATEGORIA_A_GRUPO = [
  ['hamburguesa', 'hamburguesas'],
  ['burger', 'hamburguesas'],
  ['pizza', 'pizzas'],
  ['sopa', 'postres'],        // en este menú "Sopas" contiene postres
  ['postre', 'postres'],
  ['caliente', 'calientes'],
  ['fria', 'frias'],
  ['helada', 'frias'],
  ['bebida', 'frias'],
  ['comida', 'comidas']
];

function grupo(p) {
  const g = grupoInterno(p);
  return g;
}
function grupoInterno(p) {
  const nombre = norm(p.nombre || '');
  for (const [g, claves] of PALABRAS) if (claves.some(c => new RegExp('\\b' + c + '(s|es)?\\b').test(nombre))) return g;
  const cat = norm((p.categoria && p.categoria.nombre) || '');
  for (const [clave, g] of CATEGORIA_A_GRUPO) if (cat.includes(clave)) return g;
  return 'comidas';
}

let productos = [];
let menuDia = null;      // null = aún no cargado
let modoDia = false;
let categoriaActiva = 'todas';

async function alternarMenuDia() {
  if (!modoDia && menuDia === null) {
    $('btnDia').disabled = true;
    mostrarEsqueleto();
    try {
      if (!API_MENU_DIA) throw new Error('API_MENU_DIA sin configurar');
      const r = await fetch(API_MENU_DIA, AUTH);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      menuDia = await r.json();
      $('alerta').innerHTML = '';
    } catch (e) {
      $('alerta').innerHTML = '<div class="alert alert--danger" role="alert">No se pudo cargar el menú del día. Intenta de nuevo.</div>';
      $('btnDia').disabled = false;
      pintarTabs(); pintarLista();
      return;
    }
    $('btnDia').disabled = false;
  }
  modoDia = !modoDia;
  $('btnDia').classList.toggle('btn--primary', modoDia);
  $('btnDia').classList.toggle('btn--outline', !modoDia);
  $('btnDia').setAttribute('aria-pressed', modoDia);
  categoriaActiva = 'todas';
  pintarTabs();
  pintarLista();
}

const fuente = () => (modoDia && menuDia) ? menuDia : productos;

function mostrarEsqueleto(n = 8) {
  const anchos = [62, 48, 70, 55, 66, 44, 58, 52];
  $('tabs').innerHTML = '<span class="skeleton skeleton--tab"></span>'.repeat(4);
  $('conteo').innerHTML = '<span class="skeleton skeleton--text"></span>';
  $('lista').setAttribute('aria-busy', 'true');
  $('lista').innerHTML = Array.from({length: n}, (_, i) =>
    '<div class="menu-item menu-item--skeleton" aria-hidden="true">' +
    '<span class="skeleton" style="width:' + anchos[i % anchos.length] + '%"></span>' +
    '<span class="skeleton" style="width:48px"></span></div>').join('');
}
let ultimoFoco = null;

async function cargar() {
  mostrarEsqueleto();
  if (!API_URL) { $('lista').innerHTML = ''; $('lista').removeAttribute('aria-busy'); $('tabs').innerHTML = ''; $('conteo').textContent = ''; $('alerta').innerHTML = '<div class="alert alert--danger" role="alert">Falta configurar la URL del backend (API_URL).</div>'; return; }
  try {
    const r = await fetch(API_URL, AUTH);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    productos = await r.json();
    console.table(productos.map(p => ({ producto: p.nombre, categoria_backend: p.categoria && p.categoria.nombre, se_muestra_en: NOMBRE_GRUPO[grupo(p)] })));
    iniciar();
  } catch (e) {
    $('lista').innerHTML = ''; $('lista').removeAttribute('aria-busy'); $('tabs').innerHTML = ''; $('conteo').textContent = '';
    $('alerta').innerHTML = '<div class="alert alert--danger" role="alert">No se pudo cargar el menú. Revisa la conexión e intenta de nuevo.</div>';
  }
}

function iniciar() {
  $('alerta').innerHTML = '';
  pintarTabs();
  pintarLista();
}

function pintarTabs() {
  const base = fuente();
  const items = [['todas', 'Todas', base.length],
    ...GRUPOS.map(([id, n]) => [id, n, base.filter(p => grupo(p) === id).length]).filter(x => x[2] > 0)];
  $('tabs').innerHTML = '';
  items.forEach(([id, nombre, total]) => {
    const b = document.createElement('button');
    b.className = 'tab' + (id === categoriaActiva ? ' is-active' : '');
    b.type = 'button'; b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', id === categoriaActiva);
    b.textContent = nombre + ' (' + total + ')';
    b.addEventListener('click', () => { categoriaActiva = id; pintarTabs(); pintarLista(); });
    $('tabs').appendChild(b);
  });
}

function filtrados() {
  const q = norm($('buscar').value.trim());
  const orden = $('orden').value;
  const lista = fuente().filter(p =>
    (categoriaActiva === 'todas' || grupo(p) === categoriaActiva) &&
    (!q || norm(p.nombre).includes(q)));
  lista.sort((a, b) =>
    orden === 'precio-asc' ? a.precio - b.precio :
    orden === 'precio-desc' ? b.precio - a.precio :
    a.nombre.localeCompare(b.nombre, 'es'));
  return lista;
}

function pintarLista() {
  const lista = filtrados();
  const cont = $('lista');
  cont.removeAttribute('aria-busy');
  cont.innerHTML = '';
  $('conteo').textContent = lista.length + (lista.length === 1 ? ' producto' : ' productos');
  if (!lista.length) {
    cont.innerHTML = '<div class="card empty" style="grid-column:1/-1"><h3>No hay productos con esos filtros</h3><p class="text-muted">Cambia la búsqueda o la categoría.</p><button class="btn btn--outline" id="limpiar">Quitar filtros</button></div>';
    $('limpiar').addEventListener('click', limpiar);
    return;
  }
  lista.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'menu-item';
    const n = document.createElement('span'); n.className = 'menu-item__name'; n.textContent = p.nombre;
    const pr = document.createElement('span'); pr.className = 'menu-item__price'; pr.textContent = moneda(p.precio);
    b.append(n, pr);
    b.addEventListener('click', () => abrir(p, b));
    cont.appendChild(b);
  });
}

function limpiar() {
  $('buscar').value = ''; $('orden').value = 'nombre';
  categoriaActiva = 'todas'; pintarTabs(); pintarLista();
}

function badge(texto, clase) {
  const s = document.createElement('span'); s.className = 'badge ' + clase; s.textContent = texto; return s;
}

let tokenDetalle = 0;
let productoDetalle = null;   // producto ya cargado desde el backend (null mientras carga)
let cantidadDetalle = 1;

function pintarCantidad() {
  $('dCant').textContent = cantidadDetalle;
  $('dMenos').disabled = cantidadDetalle <= 1;
  $('dMas').disabled = cantidadDetalle >= 99;
}

function pintarDetalle(d) {
  productoDetalle = d;
  $('dNombre').textContent = d.nombre;
  $('dPrecio').textContent = moneda(d.precio);
  $('dDesc').textContent = d.descripcion;
  $('dCat').textContent = 'Categoría: ' + NOMBRE_GRUPO[grupo(d)];
  const bd = $('dBadges'); bd.innerHTML = '';
  bd.appendChild(d.disponible ? badge('Disponible', 'badge--success') : badge('Agotado', 'badge--danger'));
  if (d.es_menu_del_dia) bd.appendChild(badge('Menú del día', 'badge--gold'));
  $('dAgregar').disabled = !d.disponible;   // no se puede pedir un producto agotado
}

async function abrir(p, origen) {
  ultimoFoco = origen;
  const token = ++tokenDetalle;
  productoDetalle = null; cantidadDetalle = 1; pintarCantidad();
  $('dAgregar').disabled = true;
  // Se muestra de inmediato lo que ya se conoce y un esqueleto mientras llega el detalle
  $('dNombre').textContent = p.nombre;
  $('dPrecio').textContent = moneda(p.precio);
  $('dBadges').innerHTML = '<span class="skeleton skeleton--text"></span>';
  $('dDesc').innerHTML = '<span class="skeleton" style="display:block;height:14px;margin-bottom:.5rem"></span><span class="skeleton" style="display:block;height:14px;width:70%"></span>';
  $('dCat').textContent = '';
  $('detalle').classList.add('is-open');
  $('dCerrar').focus();
  try {
    const r = await fetch(API_URL + '/' + encodeURIComponent(p.id_producto), AUTH);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (token === tokenDetalle) pintarDetalle(d);
  } catch (e) {
    if (token !== tokenDetalle) return;
    $('dBadges').innerHTML = '';
    $('dDesc').innerHTML = '<div class="alert alert--danger" role="alert">No se pudo cargar el detalle del producto. Cierra e intenta de nuevo.</div>';
  }
}

function cerrar() {
  tokenDetalle++;
  $('detalle').classList.remove('is-open');
  if (ultimoFoco) ultimoFoco.focus();
}


// ---- Pedido: carrito local y envío al backend ----
const carrito = new Map();   // id_producto -> { id_producto, nombre, precio, cantidad }

// Cada línea del pedido se envía como un ItemRequestDTO: { idProducto, cantidad, notas }.
function armarItem(item) {
  return {
    idProducto: item.id_producto,
    cantidad: item.cantidad
    // notas: '...'   // opcional
  };
}

function toast(mensaje, tipo) {
  const t = document.createElement('div');
  t.className = 'toast' + (tipo ? ' toast--' + tipo : '');
  t.textContent = mensaje;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

const totalUnidades = () => [...carrito.values()].reduce((s, i) => s + i.cantidad, 0);
const totalPrecio = () => [...carrito.values()].reduce((s, i) => s + i.cantidad * i.precio, 0);

function actualizarContador() {
  const n = totalUnidades();
  $('pedidoCount').textContent = n;
  $('btnPedido').setAttribute('aria-label', 'Ver pedido actual, ' + n + (n === 1 ? ' unidad' : ' unidades'));
}

function agregarAlPedido() {
  const d = productoDetalle;
  if (!d || !d.disponible) return;
  const previo = carrito.get(d.id_producto);
  const cantidad = Math.min(99, (previo ? previo.cantidad : 0) + cantidadDetalle);
  carrito.set(d.id_producto, { id_producto: d.id_producto, nombre: d.nombre, precio: d.precio, cantidad });
  actualizarContador();
  toast(cantidadDetalle + ' × ' + d.nombre + ' agregado al pedido');
  cerrar();
}

function pintarPedido() {
  const cont = $('pContenido');
  const items = [...carrito.values()];
  $('pEnviar').disabled = !items.length;
  $('pVaciar').disabled = !items.length;
  if (!items.length) {
    cont.innerHTML = '<div class="empty text-muted">Aún no has agregado productos.<br>Abre un producto del menú y pulsa «Agregar al pedido».</div>';
    return;
  }
  const ul = document.createElement('ul');
  ul.className = 'pedido-list';
  items.forEach(i => {
    const li = document.createElement('li'); li.className = 'pedido-row';
    const info = document.createElement('div');
    const n = document.createElement('div'); n.className = 'pedido-row__name'; n.textContent = i.nombre;
    const s = document.createElement('div'); s.className = 'pedido-row__sub'; s.textContent = moneda(i.precio) + ' c/u';
    info.append(n, s);

    const side = document.createElement('div'); side.className = 'pedido-row__side';
    const qty = document.createElement('div'); qty.className = 'qty'; qty.setAttribute('role', 'group'); qty.setAttribute('aria-label', 'Cantidad de ' + i.nombre);
    const menos = document.createElement('button'); menos.type = 'button'; menos.innerHTML = '&minus;'; menos.setAttribute('aria-label', 'Quitar una unidad de ' + i.nombre); menos.disabled = i.cantidad <= 1;
    const out = document.createElement('output'); out.textContent = i.cantidad;
    const mas = document.createElement('button'); mas.type = 'button'; mas.textContent = '+'; mas.setAttribute('aria-label', 'Agregar una unidad de ' + i.nombre); mas.disabled = i.cantidad >= 99;
    menos.addEventListener('click', () => { i.cantidad--; actualizarContador(); pintarPedido(); });
    mas.addEventListener('click', () => { i.cantidad++; actualizarContador(); pintarPedido(); });
    qty.append(menos, out, mas);

    const tot = document.createElement('div'); tot.className = 'pedido-row__total'; tot.textContent = moneda(i.precio * i.cantidad);
    const quitar = document.createElement('button'); quitar.type = 'button'; quitar.className = 'pedido-remove'; quitar.textContent = 'Quitar';
    quitar.setAttribute('aria-label', 'Quitar ' + i.nombre + ' del pedido');
    quitar.addEventListener('click', () => { carrito.delete(i.id_producto); actualizarContador(); pintarPedido(); });
    side.append(qty, tot, quitar);

    li.append(info, side);
    ul.appendChild(li);
  });
  const total = document.createElement('div'); total.className = 'pedido-total';
  total.innerHTML = '<span>Total</span><span></span>';
  total.lastChild.textContent = moneda(totalPrecio());
  cont.innerHTML = '';
  cont.append(ul, total);
}

function abrirPedido() {
  $('pError').innerHTML = '';
  try { if (!$('pId').value) $('pId').value = sessionStorage.getItem('pedidoId') || ''; } catch (e) {}
  pintarPedido();
  $('pedido').classList.add('is-open');
  ($('pId').value ? $('pCerrar') : $('pId')).focus();
}
function cerrarPedido() {
  $('pedido').classList.remove('is-open');
  $('btnPedido').focus();
}

async function enviarPedido() {
  const id = Number($('pId').value);
  if (!Number.isInteger(id) || id < 1) {
    $('pError').innerHTML = '<div class="alert alert--warning" role="alert">Escribe el número del pedido al que quieres agregar los productos.</div>';
    $('pId').focus();
    return;
  }
  if (!carrito.size) return;
  $('pError').innerHTML = '';
  $('pEnviar').disabled = true; $('pEnviar').textContent = 'Enviando…';
  try {
    const r = await fetch(API_PEDIDO_ADD + '/' + id, {
      method: 'PUT',
      headers: { ...AUTH.headers, 'Content-Type': 'application/json' },
      body: JSON.stringify([...carrito.values()].map(armarItem))
    });
    if (!r.ok) {
      const texto = await r.text().catch(() => '');
      console.error('PUT ' + r.url + ' falló con ' + r.status, texto);
      let extra = '';
      try { const j = JSON.parse(texto); extra = j.message || j.error || ''; } catch (e) { extra = texto.slice(0, 200); }
      const msg = r.status === 404 ? 'El servidor respondió 404: no se encontró el pedido ' + id + ' o la ruta ' + r.url + '.'
        : (r.status === 401 || r.status === 403) ? 'No tienes permiso para modificar este pedido (código ' + r.status + ').'
        : 'El servidor respondió con error ' + r.status + (extra ? ': ' + extra : '') + '.';
      throw new Error(msg);
    }
    try { sessionStorage.setItem('pedidoId', String(id)); } catch (e) {}
    const unidades = totalUnidades();
    carrito.clear();
    actualizarContador();
    cerrarPedido();
    toast(unidades + (unidades === 1 ? ' producto agregado' : ' productos agregados') + ' al pedido #' + id, 'success');
  } catch (e) {
    const msg = e instanceof TypeError ? 'No se pudo conectar con el servidor. Revisa tu conexión.' : e.message;
    $('pError').innerHTML = '<div class="alert alert--danger" role="alert"></div>';
    $('pError').firstChild.textContent = msg;
  } finally {
    $('pEnviar').textContent = 'Agregar al pedido';
    pintarPedido();
  }
}

$('buscar').addEventListener('input', pintarLista);
$('orden').addEventListener('change', pintarLista);
$('btnDia').addEventListener('click', alternarMenuDia);
$('dCerrar').addEventListener('click', cerrar);
$('dOk').addEventListener('click', cerrar);
$('detalle').addEventListener('click', e => { if (e.target === $('detalle')) cerrar(); });
$('dMenos').addEventListener('click', () => { if (cantidadDetalle > 1) { cantidadDetalle--; pintarCantidad(); } });
$('dMas').addEventListener('click', () => { if (cantidadDetalle < 99) { cantidadDetalle++; pintarCantidad(); } });
$('dAgregar').addEventListener('click', agregarAlPedido);
$('btnPedido').addEventListener('click', abrirPedido);
$('btnVolver').addEventListener('click', e => {
  // Evita perder sin querer productos que aún no se han enviado al pedido
  if (carrito.size && !confirm('Tienes productos sin enviar al pedido. ¿Volver de todas formas?')) e.preventDefault();
});
$('pCerrar').addEventListener('click', cerrarPedido);
$('pVaciar').addEventListener('click', () => { carrito.clear(); actualizarContador(); pintarPedido(); });
$('pEnviar').addEventListener('click', enviarPedido);
$('pedido').addEventListener('click', e => { if (e.target === $('pedido')) cerrarPedido(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('salir').classList.contains('is-open')) cancelarSalir();
  else if ($('pedido').classList.contains('is-open')) cerrarPedido();
  else if ($('detalle').classList.contains('is-open')) cerrar();
  else menuUsuario(false);
});

// Solo carga datos si hay sesión (si no, Auth.require() ya redirigió al login)
if (Auth.isLoggedIn()) {
  pintarUsuario();
  actualizarContador();
  cargar();
}
</script>
